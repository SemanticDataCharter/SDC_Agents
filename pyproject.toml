[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdc-agents"
version = "4.6.0"
description = "Purpose-scoped ADK agents for SDC4 data operations"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Timothy W. Cook", email = "tim@semanticdatacharter.org" },
]
maintainers = [
    { name = "Axius SDC, Inc.", email = "contact@axius-sdc.com" },
]
keywords = ["sdc4", "semantic-data", "adk", "agents", "xml", "rdf", "sparql", "data-modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "google-adk>=2.14.0",  # CVE-2026-4810 (>=1.28.1); 2.14.0 is the first to allow the fixed opentelemetry-api
    "opentelemetry-api>=1.45.1",  # Security: CVE-2026-114603 (transitive via google-adk)
    "click>=8",
    "pydantic>=2",
    "pyyaml>=6",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2",   # the introspect toolset uses the asyncio extension (needs greenlet)
    "motor>=3.6",
    "jsonpath-ng>=1.6",
    "sdcvalidator>=4.5.3",      # local validation (Validation toolset, 4.5.0)
    # Security floors for packages pulled in by the dependencies above
    # (pip-audit, 2026-11-15). Each is the lowest release fixing every advisory listed.
    "pymongo>=4.18.3",          # via motor: PYSEC-2026-4294..4297, CVE-2026-106435
    "urllib3>=2.8.0",           # PYSEC-2026-4175..4177
    "certifi>=2026.10.18",      # via httpx: PYSEC-2026-4320
    "dnspython>=2.9.2",         # via pymongo: CVE-2026-114605, CVE-2026-128089
    "joserfc>=1.7.6",           # CVE-2026-119283, CVE-2026-119284
    "pyasn1>=0.6.5",            # CVE-2026-119194..119197
]

[project.scripts]
sdc-agents = "sdc_agents.cli:main"

[project.urls]
Repository = "https://github.com/SemanticDataCharter/SDC_Agents"
Documentation = "https://github.com/SemanticDataCharter/SDC_Agents/blob/main/docs/dev/SDC_AGENTS_PRD.md"
Issues = "https://github.com/SemanticDataCharter/SDC_Agents/issues"
Changelog = "https://github.com/SemanticDataCharter/SDC_Agents/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "black>=24",
    "ruff>=0.5",
    "aiosqlite>=0.20",
    "mongomock>=4",
    # The BigQuery introspection tests are part of the suite, so a plain
    # `pip install -e ".[dev]"` must be able to run them. Without this they
    # fail on a missing google.cloud and look like a code fault.
    "sdc-agents[bigquery]",
]
bigquery = [
    "google-cloud-bigquery>=3",
]
knowledge = [
    "chromadb>=0.5",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]
vertex-ai-search = [
    "google-cloud-aiplatform>=1.52",
]
toolbox = [
    "toolbox-adk>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sdc_agents"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 99
target-version = ["py311"]
